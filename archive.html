*{box-sizing:border-box}
html,body{

.old-button{

}
.old-button::before{

  clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px);
}
.old-button:hover{color:rgba(255,248,232,.95);filter:brightness(1.12)}
.old-button:active{transform:translate(1px,1px)}
.back-home{

.archive-deck span{

@keyframes deckBlink{

.archive-head{
  position:absolute;
  left:calc(var(--safe-l) + clamp(14px,3.2vw,52px));

  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:18px;
}
.kicker{
  display:block;
  margin:0 0 9px;
  color:rgba(222,214,198,.48);
  font-size:11px;
  line-height:1.25;

  letter-spacing:.022em;
}
h1{

  color:rgba(225,218,204,.70);

.archive-count{

  font-size:11px;
  line-height:1.45;
  letter-spacing:.01em;
  text-align:right;
}

.stage{
  position:absolute;
  inset:0;
  z-index:12;
  overflow:hidden;
  pointer-events:none;
  contain:layout paint style;
}
.archive-card{
  position:absolute;
  left:0;
  top:0;
  width:var(--w);
  aspect-ratio:var(--ar);
  z-index:var(--z);
  opacity:0;
  transform:translate3d(var(--x), var(--y), 0);
  will-change:transform,opacity;
  pointer-events:auto;
  contain:layout paint style;
  animation-duration:var(--dur);
  animation-delay:var(--delay);
  animation-timing-function:linear;
  animation-iteration-count:infinite;
  animation-direction:alternate;
}
.archive-card[data-axis="x"]{animation-name:travelX}
.archive-card[data-axis="y"]{animation-name:travelY}
@keyframes travelX{
  0%{transform:translate3d(calc(var(--x) - var(--travel)), var(--y), 0)}
  100%{transform:translate3d(calc(var(--x) + var(--travel)), var(--y), 0)}
}
@keyframes travelY{
  0%{transform:translate3d(var(--x), calc(var(--y) - var(--travel)), 0)}
  100%{transform:translate3d(var(--x), calc(var(--y) + var(--travel)), 0)}
}
.archive-card.is-live{
  opacity:var(--op);
  transition:opacity .72s ease, filter .72s ease;
}
.archive-card.is-changing{
  opacity:.05;
  filter:blur(6px);
}
.archive-card.is-front{
  --op:.98;
  z-index:42;
}
.archive-card.is-quiet{
  --op:.24;
  z-index:8;
}
.archive-card::before,
.archive-card::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
}
.archive-card::before{
  border:1px solid rgba(214,204,183,.15);
  box-shadow:
    inset 1px 1px 0 rgba(235,224,199,.06),
    inset -1px -1px 0 rgba(0,0,0,.82),
    0 10px 32px rgba(0,0,0,.54);
}
.archive-card::after{
  opacity:var(--surface);
  mix-blend-mode:overlay;
  background:
    repeating-linear-gradient(0deg,transparent 0 10px,rgba(234,224,205,.075) 11px 12px),
    repeating-linear-gradient(90deg,transparent 0 17px,rgba(234,224,205,.045) 18px 19px);
  animation:surfaceFlicker var(--surface-dur) steps(4,end) infinite;
}
@keyframes surfaceFlicker{
  0%,100%{opacity:calc(var(--surface) * .55);transform:translate3d(0,0,0)}
  31%{opacity:calc(var(--surface) * 1.1);transform:translate3d(1px,0,0)}

  62%{opacity:calc(var(--surface) * .35)}
  81%{opacity:calc(var(--surface) * 1.4);transform:translate3d(0,-1px,0)}
}
.archive-card img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#050403;
  opacity:1;
  filter:none;
  transform:translate3d(0,0,0) scale(1.002);
  backface-visibility:hidden;
  transition:opacity .45s ease, transform .75s cubic-bezier(.16,1,.3,1);
}
.archive-card:hover,
.archive-card:focus-within{
  z-index:90;
  opacity:1!important;
}
.archive-card:hover img,
.archive-card:focus-within img{
  transform:translate3d(0,0,0) scale(1.018);
}
.burst{
  position:absolute;
  inset:0;
  z-index:50;
  pointer-events:none;
  overflow:hidden;
}
.burst-line{
  position:absolute;
  left:0;
  right:0;
  height:1px;
  top:var(--t);
  opacity:0;
  background:linear-gradient(90deg,transparent,rgba(231,222,201,.22),transparent);
  transform:translate3d(var(--sx),0,0) scaleX(var(--scale));
  animation:burstLine var(--dur) steps(3,end) infinite var(--delay);
}
@keyframes burstLine{
  0%,91%,100%{opacity:0}

  94%{opacity:.54;transform:translate3d(0,0,0) scaleX(var(--scale))}

.mode-line{
  position:absolute;

.sr{
  position:absolute!important;
  width:1px!important;height:1px!important;
  padding:0!important;margin:-1px!important;
  overflow:hidden!important;clip:rect(0,0,0,0)!important;
  white-space:nowrap!important;border:0!important;
}

@media(max-width:760px){
  #root::after{inset:7px}
  .old-grid{inset:12px;opacity:.24}
  .wordmark{width:150vw;top:calc(var(--safe-t) + 2vh);opacity:.17}
  h1{font-size:clamp(58px,22vw,116px)}
  .archive-head{
    left:calc(var(--safe-l) + 13px);

  }
  .archive-count{font-size:10px;line-height:1.35;text-align:left;max-width:260px}
  .old-button{font-size:10px}
  .back-home{min-height:31px;min-width:54px;padding:7px 10px 8px}
  .archive-deck{display:none}
  .mode-line{display:none}
}
@media(max-width:390px){

}
@media(max-height:620px) and (orientation:landscape){

}
@media(prefers-reduced-motion:reduce){

  .noise-canvas{display:none}
  .archive-card{animation:none!important;opacity:.86!important;filter:none!important}
  .archive-card:nth-child(n+17){display:none}
}
</style>

      if (!active) cancelAnimationFrame(raf);
      else { resize(); raf=requestAnimationFrame(draw); }
    });
    resize();
    raf = requestAnimationFrame(draw);
  }

  shuffle();
  buildStage();
  burstLines();
  runNoise();

  document.addEventListener("visibilitychange",()=>{
    active = !document.hidden;
    body.classList.toggle("is-frozen", !active);
    if (!active) {
      clearLiveTimers();
      clearInterval(swapTimer);
    } else if (!reduced) {
      slots.forEach((slot, i) => scheduleSwap(slot, 320 + i * 70));
      startGlobalPulse();
    }
  });
})();
</script>
</body>
</html>
