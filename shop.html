<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0c0b">
  <meta name="description" content="Available and archive garments by Springtime Wishes, designed and sewn in Mexico.">
  <title>Shop — Springtime Wishes</title>
  <link rel="stylesheet" href="shop-archive.css">
</head>
<body class="shop-page" data-page="shop">
  <header class="site-header">
    <a class="site-wordmark" href="index.html" aria-label="Springtime Wishes home">springtime wishes</a>
    <nav class="site-context" aria-label="shop context">
      <a href="shop.html" aria-current="page">shop</a>
      <a href="archive.html">archive</a>
    </nav>
    <button class="cart-trigger" type="button" data-cart-open>bag (<span data-cart-count>00</span>)</button>
  </header>

  <main>
    <section class="shop-intro" aria-labelledby="shop-title">
      <div>
        <span class="kicker">springtime wishes / available garments</span>
        <h1 id="shop-title">shop</h1>
      </div>
      <div class="shop-intro-copy">
        <p>garments shaped through fabric, memory and the body.</p>
        <span>designed and sewn in mexico / limited quantities</span>
      </div>
    </section>

    <section class="catalog" aria-label="available garments">
      <div class="catalog-tools">
        <span class="catalog-count" data-catalog-count>05 garments</span>
        <div class="filter-group" role="group" aria-label="filter garments">
          <button class="is-active" type="button" data-filter="all" aria-pressed="true">all</button>
          <button type="button" data-filter="dresses" aria-pressed="false">dresses</button>
          <button type="button" data-filter="separates" aria-pressed="false">separates</button>
        </div>
        <select class="sort-select" data-sort aria-label="sort garments">
          <option value="index">archive order</option>
          <option value="price-low">price / low to high</option>
          <option value="price-high">price / high to low</option>
        </select>
      </div>
      <div class="product-grid" data-product-grid></div>
      <noscript>JavaScript is required to view the shop and use the bag.</noscript>
    </section>

    <footer class="shop-footer">
      <p>garments as evidence of what the body keeps.</p>
      <span>small production / mexico city</span>
    </footer>
  </main>

  <script src="shop-catalog.js"></script>
  <script src="shop-ui.js"></script>
</body>
</html>
